# 1.节点配置
proxies:
  - name: "直连"
    type: direct
    udp: true
    # 优化: direct 类型下 client-fingerprint 无效,已移除

 # 2.订阅源配置  url 里填写自己的订阅,名称不能重复
proxy-providers:
  融合订阅:
    proxy: DIRECT
    url: ""
    type: http
    interval: 86400
    health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}
    override:
      dialer-proxy: 国外前置

  链式代理:
    proxy: DIRECT
    url: ""
    type: http
    interval: 86400
    health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}
    override:
      dialer-proxy: 国外节点选择

  中转:
    proxy: DIRECT
    url: ""
    type: http
    interval: 86400
    health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 300}

# 3.基础设置
mixed-port: 1071
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
secret: ""   # 优化: 新增 API 密码,防止局域网内被无认证控制 (只在本机用面板可改为 127.0.0.1:9090)
external-ui: ./webroot/Zash/
external-ui-url: "https://gh.301.ee/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
geox-url:
  mmdb: "https://gh.301.ee/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
find-process-mode: strict
#global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true          # 优化: fake-ip 模式下建议开启,重启后映射保持稳定

sniffer:
  enable: true
  force-dns-mapping: true      # 优化: 对已有 fake-ip 映射的连接恢复真实域名
  parse-pure-ip: true          # 优化: 对纯 IP 连接也尝试嗅探域名
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.lan"

tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  # Windows 阻止多网卡 DNS 外发；Android 仍需在系统设置中关闭私人 DNS。
  strict-route: true
  dns-mode: hijack

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip       # 优化: redir-host -> fake-ip,性能更好且规避本地 DNS 污染
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:              # 以下域名走真实解析(直连/局域网/特殊服务)
    - "rule-set:cn_domain"     # 复用已有 mrs 规则集,国内域名真实解析后直连
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
  listen: 0.0.0.0:1053
  # 每个上游显式指定出口，不依赖 DNS 服务器 IP 的路由归属。
  respect-rules: false
  default-nameserver: &dns_direct
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://1.12.12.12/dns-query#DIRECT"
  nameserver: &dns_remote
    - "https://1.1.1.1/dns-query#国外选择"
    - "https://8.8.8.8/dns-query#国外选择"
  # 节点引导解析使用直连 DoH，避免依赖尚未建立的代理。
  proxy-server-nameserver: *dns_direct
  # 直连下载订阅和规则时使用独立 DoH，避免首次启动依赖尚未下载的节点。
  direct-nameserver: *dns_direct
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "+.tailscale.com": *dns_direct
    "+.ts.net": *dns_direct
    "+.new.mumuyun.cn": *dns_remote
    "+.66hxhx.xyz": *dns_remote
    "rule-set:private_domain": *dns_direct
    # 与前面的域名路由规则保持优先级，避免与 cn_domain 重叠时直连查询。
    "rule-set:openai_domain,google-gemini_domain,github_domain,twitter_domain,youtube_domain,google_domain,telegram_domain,netflix_domain,bahamut_domain,spotify_domain,biliintl_domain,pixiv_domain,ehentai_domain,pikpak_domain": *dns_remote
    "rule-set:bilibili_domain,cn_domain": *dns_direct

# 4.策略组设置
proxy-groups:
  - name: 国外前置
    type: select
    # 注意: 默认选中第一项「直连」,即融合订阅节点默认直连落地、不走中转;
    #       若想默认走国内中转,把中转节点排到第一位或改为 url-test
    proxies: [直连]

  - name: 国外选择
    type: select
    proxies: [国外节点选择,链式代理,直连]

  - name: 国外节点选择
    type: select
    use: [融合订阅]
    proxies: [自动选择,直连]

  - name: 链式代理
    type: select
    empty-fallback: REJECT
    use: [链式代理]

  - name: Openai
    type: select
    proxies: [国外选择,链式代理,自动选择]

  - name: 自动选择
    type: url-test
    empty-fallback: REJECT
    use:
      - 融合订阅
    filter: '(?i)^(?!.*(?:free|\bLO\b|公益|public)).*'   # 优化: LO 加词边界,避免误伤 Colombia/Slovenia/Los Angeles 等含 "lo" 的节点名
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 3000
    tolerance: 50
    lazy: true

# 5.规则设置
rules:
  - DOMAIN-SUFFIX,leiniao.com,REJECT
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,66hxhx.xyz,国外选择
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连          # 优化: 启用原本定义却未引用的规则集
  - RULE-SET,ads_domain,REJECT            # 广告拦截 (category-ads-all)
  - RULE-SET,openai_domain,Openai
  - RULE-SET,google-gemini_domain,国外选择
  - RULE-SET,github_domain,国外选择
  - RULE-SET,twitter_domain,国外选择
  - RULE-SET,youtube_domain,国外选择
  - RULE-SET,google_domain,国外选择
  - RULE-SET,telegram_domain,国外选择
  - RULE-SET,netflix_domain,国外选择
  - RULE-SET,bahamut_domain,国外选择
  - RULE-SET,spotify_domain,国外选择
  - RULE-SET,biliintl_domain,国外选择     # 优化: 启用原本定义却未引用的规则集
  - RULE-SET,pixiv_domain,国外选择        # 优化: 启用原本定义却未引用的规则集
  - RULE-SET,ehentai_domain,国外选择      # 优化: 启用原本定义却未引用的规则集
  - RULE-SET,pikpak_domain,国外选择
  - RULE-SET,bilibili_domain,直连
  - RULE-SET,cn_domain,直连

  - RULE-SET,geolocation-!cn,国外选择

  # IP 规则只匹配已知真实 IP，不为规则匹配额外解析域名。
  - RULE-SET,google_ip,国外选择,no-resolve
  - RULE-SET,netflix_ip,国外选择,no-resolve
  - RULE-SET,telegram_ip,国外选择,no-resolve
  - RULE-SET,twitter_ip,国外选择,no-resolve
  - RULE-SET,cn_ip,直连,no-resolve
  - MATCH,国外选择

# 6.规则集定义  (优化: 全部改用 gh.301.ee 镜像,避免 raw.githubusercontent.com 在国内被污染/拉取失败)
rule-anchor:
  ip: &ip {proxy: DIRECT, type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {proxy: DIRECT, type: http, interval: 86400, behavior: domain, format: mrs}
rule-providers:
  private_domain:
    <<: *domain
    url: "https://gh.301.ee/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  ads_domain:
